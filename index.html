<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apuração Presidencial • TSE</title>
<style>
:root{--red:#ff424d;--blue:#3988ff;--white:#f5f6ff;--muted:#c2c9e8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:auto;min-height:0;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--white)}
body{display:block}
.panel{width:100%;height:auto;padding:7px 9px 6px;background:rgba(7,12,34,.86);border:2px solid #667cff;border-radius:11px;box-shadow:0 0 0 2px rgba(30,60,255,.3),inset 0 0 16px rgba(72,50,255,.2),0 0 12px rgba(80,65,255,.5);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;inset:3px;border:1px solid rgba(99,111,255,.45);border-radius:7px;pointer-events:none}
.heading{display:flex;align-items:center;justify-content:center;gap:8px;font-weight:900;font-size:clamp(11px,2.2vw,21px);letter-spacing:.4px;text-align:center;text-shadow:0 0 7px #6377ff;white-space:nowrap}
.line{height:4px;width:8%;border-radius:5px;flex-shrink:0}
.red{background:var(--red);box-shadow:0 0 7px var(--red)}.blue{background:var(--blue);box-shadow:0 0 7px var(--blue)}
.candidates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:7px}
.candidate{min-width:0;background:rgba(5,11,30,.76);border:1px solid #6978b6;border-radius:7px;padding:5px 7px 4px;text-align:center;position:relative}
.candidate.lula{border-left:5px solid var(--red)}.candidate.flavio{border-left:5px solid var(--blue)}
.name{font-weight:900;font-size:clamp(10px,1.6vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.percent{font-weight:1000;font-size:clamp(19px,3.4vw,34px);line-height:1.02;margin-top:1px;text-shadow:0 0 7px rgba(255,255,255,.16)}
.votes{color:var(--muted);font-size:clamp(9px,1.25vw,13px);font-weight:700}
.progress-label{display:flex;justify-content:space-between;gap:8px;margin:6px 2px 3px;font-weight:800;font-size:clamp(9px,1.3vw,13px);color:var(--muted)}
.track{height:6px;background:#252e50;border:1px solid #6573b1;border-radius:9px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#ff424d,#ffb34d,#3988ff);transition:width .6s ease}
.footer{text-align:center;margin-top:4px;color:#d2d8f5;font-size:clamp(8px,1.05vw,11px);font-weight:700;line-height:1.15}
.status{color:#ffe47a;font-weight:900}
</style>
</head>
<body>
<main class="panel" aria-label="Painel de apuração presidencial">
  <div class="heading"><span class="line red"></span><span>APURAÇÃO PRESIDENCIAL · TSE</span><span class="line blue"></span></div>
  <section class="candidates">
    <article class="candidate lula"><div class="name" id="name13">LULA · 13</div><div class="percent" id="pct13">—%</div><div class="votes" id="votes13">— votos</div></article>
    <article class="candidate flavio"><div class="name" id="name22">FLÁVIO · 22</div><div class="percent" id="pct22">—%</div><div class="votes" id="votes22">— votos</div></article>
  </section>
  <div class="progress-label"><span>URNAS APURADAS</span><span id="urnas">Aguardando dados…</span></div>
  <div class="track"><div class="fill" id="fill"></div></div>
  <div class="footer"><span id="status" class="status">CONECTANDO À FONTE OFICIAL</span> · Fonte: TSE · atualização automática</div>
</main>
<script>
/*
 * Placar TSE — integração baseada no JSON oficial.
 * A consulta real usa o arquivo nacional da eleição presidencial de 2º turno
 * (eleição 6258, pleito 3221, 25/10/2026): .../dados/br/br-c0001-e006258-u.json
 * ?demo=1 ativa números fictícios SOMENTE para testar o visual.
 */
const DATA_URL = "https://resultados.tse.jus.br/oficial/ele2026/6258/dados/br/br-c0001-e006258-u.json";
const DEMO = new URLSearchParams(location.search).get("demo") === "1";

// O TSE não publica uma cadência fixa (o arquivo muda quando há nova totalização) e permite até
// 100 requisições/s por IP, então 20 s é leve e já acompanha a apuração de perto.
const UPDATE_INTERVAL_MS = 20000;
const REQUEST_TIMEOUT_MS = 15000;        // não deixa uma consulta travada impedir as próximas
const KEEP_STALE_MS = 5 * 60 * 1000;     // se a consulta falhar, mantém os últimos números por até 5 min (com aviso)
const MISSING_WAIT_MS = 60000;           // arquivo ainda não publicado (404): espera mais entre tentativas
const BLOCK_WAIT_MS = 11 * 60 * 1000;    // o TSE bloqueia o IP por 10 min se houver excesso de requisições/404

const fmtInt = value => Number(value || 0).toLocaleString("pt-BR");

function setText(id, value) {
  const element = document.getElementById(id);
  if (element) element.textContent = value;
}

function parseTseNumber(value) {
  if (value === undefined || value === null || value === "") return 0;
  // No JSON do TSE, percentuais como pvap/pst vêm como "45,98".
  const normalized = String(value).trim().replace(",", ".");
  const parsed = Number(normalized);
  return Number.isFinite(parsed) ? parsed : 0;
}

function parseVotes(value) {
  // Votos vêm como texto só com dígitos; tira qualquer separador por segurança.
  const digits = String(value ?? "").replace(/\D/g, "");
  return digits ? Number(digits) : 0;
}

function renderCandidate(number, name, percent, votes) {
  setText("name" + number, name + " · " + number);
  setText("pct" + number, percent.toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + "%");
  setText("votes" + number, fmtInt(votes) + " votos");
}

function renderUrnas(percent) {
  const safePercent = Math.max(0, Math.min(100, Number(percent) || 0));
  setText("urnas", safePercent.toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + "%");
  document.getElementById("fill").style.width = safePercent + "%";
}

function clearResults(status) {
  setText("pct13", "—%");
  setText("pct22", "—%");
  setText("votes13", "— votos");
  setText("votes22", "— votos");
  setText("urnas", "indisponível");
  document.getElementById("fill").style.width = "0%";
  setText("status", status);
}

/* Modo de demonstração: os valores abaixo são inventados e não vêm do TSE. */
let demoVotes13 = 1250;
let demoVotes22 = 1480;
let demoUrnas = 12;

function updateDemo() {
  const totalVotes = demoVotes13 + demoVotes22;
  renderCandidate("13", "LULA", demoVotes13 / totalVotes * 100, demoVotes13);
  renderCandidate("22", "FLÁVIO BOLSONARO", demoVotes22 / totalVotes * 100, demoVotes22);
  renderUrnas(demoUrnas);
  setText("status", "MODO DE TESTE · DADOS FICTÍCIOS");
}

function changeDemo() {
  demoVotes13 += Math.floor(Math.random() * 90) + 10;
  demoVotes22 += Math.floor(Math.random() * 90) + 10;
  demoUrnas = Math.min(100, demoUrnas + Math.random() * 4 + 1);
  updateDemo();
}

/* ---------- Consulta ao TSE ---------- */
class HttpError extends Error {
  constructor(status) {
    super("O servidor do TSE respondeu HTTP " + status);
    this.status = status;
  }
}

// Desce por carg → agr → par → cand (estrutura do arquivo -u.json). Se o TSE mudar o aninhamento,
// cai numa busca recursiva por objetos que tenham número (n) e votos (vap).
function collectCandidates(cargo) {
  const found = [];
  for (const group of (cargo.agr || [])) {
    for (const party of (group.par || [])) {
      for (const candidate of (party.cand || [])) found.push(candidate);
    }
  }
  if (found.length) return found;
  (function walk(node, depth) {
    if (!node || typeof node !== "object" || depth > 6) return;
    if (!Array.isArray(node) && node.n !== undefined && node.vap !== undefined) { found.push(node); return; }
    for (const value of (Array.isArray(node) ? node : Object.values(node))) walk(value, depth + 1);
  })(cargo, 0);
  return found;
}

let lastGood = null;      // { at: ms, time: "hh:mm:ss" } da última consulta que deu certo
let missingCount = 0;     // quantas vezes seguidas o arquivo deu 404

async function updateResults() {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
  let response;
  try {
    // O parâmetro nocache evita que um cache intermediário (CDN) devolva um JSON velho.
    response = await fetch(DATA_URL + "?nocache=" + Date.now(), {
      cache: "no-store",
      headers: { "Accept": "application/json" },
      signal: controller.signal
    });
  } finally {
    clearTimeout(timer);
  }

  if (!response.ok) throw new HttpError(response.status);

  const data = await response.json();

  if (!Array.isArray(data.carg)) {
    throw new Error("JSON recebido, mas não contém a lista 'carg' esperada");
  }

  // O código do cargo pode vir como "1" ou "0001"; compara como número.
  const presidentCargo = data.carg.find(cargo => Number(cargo.cd) === 1) ||
    (data.carg.length === 1 ? data.carg[0] : null);
  if (!presidentCargo) {
    throw new Error("Cargo Presidente (cd=1) não encontrado");
  }

  const candidates = collectCandidates(presidentCargo);

  // O campo n no JSON oficial contém o número do candidato na urna.
  const lula = candidates.find(candidate => String(candidate.n).trim() === "13");
  const flavio = candidates.find(candidate => String(candidate.n).trim() === "22");

  if (!lula || !flavio) {
    throw new Error("Não encontrei os candidatos de número 13 e 22 no arquivo oficial");
  }

  const lulaVotes = parseVotes(lula.vap);
  const flavioVotes = parseVotes(flavio.vap);

  // pvap = percentual do candidato sobre os votos válidos. Se faltar, no 2º turno os votos
  // válidos são só os dos dois candidatos, então dá para calcular.
  const totalTwo = lulaVotes + flavioVotes;
  const lulaPercent = (lula.pvap !== undefined && lula.pvap !== "") ? parseTseNumber(lula.pvap)
    : (totalTwo ? lulaVotes / totalTwo * 100 : 0);
  const flavioPercent = (flavio.pvap !== undefined && flavio.pvap !== "") ? parseTseNumber(flavio.pvap)
    : (totalTwo ? flavioVotes / totalTwo * 100 : 0);

  renderCandidate("13", lula.nmu || lula.nm || "LULA", lulaPercent, lulaVotes);
  renderCandidate("22", flavio.nmu || flavio.nm || "FLÁVIO", flavioPercent, flavioVotes);

  // O TSE já fornece pst: percentual de seções totalizadas.
  // Usar esse campo evita calcular percentual com campos interpretados incorretamente.
  const sections = data.s || {};
  const percentApurado = parseTseNumber(sections.pst);
  renderUrnas(percentApurado);

  const generatedAt = [data.dg, data.hg].filter(Boolean).join(" ");
  const notStarted = parseVotes(sections.st) === 0 && totalTwo === 0 && percentApurado === 0;
  if (notStarted) {
    setText("status", "AGUARDANDO TOTALIZAÇÃO" + (generatedAt ? " · ARQUIVO " + generatedAt : ""));
  } else {
    setText("status", "DADOS TSE · CONSULTA " + new Date().toLocaleTimeString("pt-BR") +
      (generatedAt ? " · ARQUIVO " + generatedAt : ""));
  }

  lastGood = { at: Date.now(), time: new Date().toLocaleTimeString("pt-BR") };
  missingCount = 0;

  console.info("TSE: atualização concluída", {
    generatedAt,
    lulaVotes: lula.vap,
    lulaPercent: lula.pvap,
    flavioVotes: flavio.vap,
    flavioPercent: flavio.pvap,
    sectionsTotal: sections.ts,
    sectionsCounted: sections.st,
    sectionsPercent: sections.pst
  });
  return UPDATE_INTERVAL_MS;
}

// Falhou: não deixa número velho parecendo atual. Mantém os últimos valores por até KEEP_STALE_MS,
// sempre dizendo na linha de status que são antigos; passado esse tempo, apaga.
function showFailure(message) {
  if (lastGood && Date.now() - lastGood.at < KEEP_STALE_MS) {
    setText("status", message + " · DADOS DE " + lastGood.time);
  } else {
    lastGood = null;
    clearResults(message);
  }
}

function handleFailure(error) {
  console.error("Erro ao consultar dados do TSE:", error);
  if (error && error.status === 404) {
    // Antes da publicação o TSE responde 404; vários 404 seguidos podem bloquear o IP, então espera mais.
    missingCount++;
    showFailure("AGUARDANDO PUBLICAÇÃO DO TSE");
    return missingCount >= 5 ? MISSING_WAIT_MS * 2 : MISSING_WAIT_MS;
  }
  if (error && (error.status === 403 || error.status === 429)) {
    showFailure("TSE LIMITOU O ACESSO · NOVA TENTATIVA EM 11 MIN");
    return BLOCK_WAIT_MS;
  }
  showFailure("ERRO NA CONSULTA · VERIFIQUE CONEXÃO/CORS");
  return UPDATE_INTERVAL_MS;
}

// Uma consulta por vez: a próxima só é marcada quando a anterior termina.
async function pollLoop() {
  let wait = UPDATE_INTERVAL_MS;
  try {
    wait = await updateResults();
  } catch (error) {
    wait = handleFailure(error);
  }
  setTimeout(pollLoop, wait);
}

if (DEMO) {
  updateDemo();
  setInterval(changeDemo, 3000);
} else {
  pollLoop();
}
</script>
</body>
</html>
