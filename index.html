
<script>
const DATA_URL = "https://resultados.tse.jus.br/oficial/ele2026/6258/dados/br/br-c0001-e006258-u.json";

const DEMO = new URLSearchParams(location.search).get("demo") === "1";

const fmtInt = n => Number(n || 0).toLocaleString("pt-BR");

function setText(id, value) {
  document.getElementById(id).textContent = value;
}

function parsePct(value) {
  if (value === undefined || value === null || value === "") return 0;
  const s = String(value).trim();
  return Number(s.includes(",") ? s.replace(",", ".") : s) || 0;
}

function renderCandidate(id, name, number, pct, votes) {
  setText("name" + number, name + " · " + number);
  setText("pct" + number, pct.toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + "%");
  setText("votes" + number, fmtInt(votes) + " votos");
}

function renderUrnas(percent) {
  percent = Math.max(0, Math.min(100, percent));
  setText("urnas", percent.toLocaleString("pt-BR", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }) + "%");
  document.getElementById("fill").style.width = percent + "%";
}

// MODO DE TESTE: usa somente números fictícios
let demoVotes13 = 1250;
let demoVotes22 = 1480;
let demoUrnas = 12;

function updateDemo() {
  const total = demoVotes13 + demoVotes22;
  const pct13 = demoVotes13 / total * 100;
  const pct22 = demoVotes22 / total * 100;

  renderCandidate("13", "LULA", "13", pct13, demoVotes13);
  renderCandidate("22", "FLÁVIO BOLSONARO", "22", pct22, demoVotes22);
  renderUrnas(demoUrnas);

  setText("status", "MODO DE TESTE · DADOS FICTÍCIOS");
}

function changeDemo() {
  demoVotes13 += Math.floor(Math.random() * 90) + 10;
  demoVotes22 += Math.floor(Math.random() * 90) + 10;
  demoUrnas = Math.min(100, demoUrnas + Math.random() * 4 + 1);
  updateDemo();
}

async function updateResults() {
  try {
    const response = await fetch(DATA_URL + "?_=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    const cargo = (data.carg || []).find(c => String(c.cd) === "1")
      || (data.carg || [])[0];

    const candidates = [];

    for (const group of (cargo?.agr || [])) {
      for (const party of (group.par || [])) {
        for (const cand of (party.cand || [])) {
          candidates.push(cand);
        }
      }
    }

    const lula = candidates.find(c =>
      String(c.n) === "13" || /LULA/i.test(c.nmu || c.nm || "")
    );

    const flavio = candidates.find(c =>
      String(c.n) === "22" || /FLAVIO/i.test(c.nmu || c.nm || "")
    );

    if (!lula || !flavio) {
      throw new Error("Candidatos não encontrados no JSON");
    }

    const lp = parsePct(lula.pvap);
    const fp = parsePct(flavio.pvap);

    renderCandidate("13", lula.nmu || "LULA", "13", lp, lula.vap);
    renderCandidate("22", flavio.nmu || "FLÁVIO", "22", fp, flavio.vap);

    const sections = data.s || {};
    const counted = Number(sections.st || 0);
    const total = Number(sections.ts || 0);
    const percent = total > 0
      ? counted / total * 100
      : parsePct(sections.pst);

    renderUrnas(percent);

    setText("status",
      (lp === 0 && fp === 0 && percent === 0)
        ? "AGUARDANDO TOTALIZAÇÃO"
        : "DADOS RECEBIDOS · " + new Date().toLocaleTimeString("pt-BR")
    );

  } catch (error) {
    setText("status", "ERRO NA CONSULTA · " + error.message);
    setText("urnas", "indisponível");
    setText("pct13", "—%");
    setText("pct22", "—%");
    setText("votes13", "— votos");
    setText("votes22", "— votos");
    document.getElementById("fill").style.width = "0%";
    console.error("Erro ao consultar dados do TSE:", error);
  }
}

if (DEMO) {
  updateDemo();
  setInterval(changeDemo, 3000);
} else {
  updateResults();
  setInterval(updateResults, 30000);
}
</script>
