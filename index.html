<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apuração Presidencial • TSE</title>
<style>
:root{--red:#ff424d;--blue:#3988ff;--white:#f5f6ff;--muted:#c2c9e8}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:auto;min-height:0;background:transparent;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--white)}
body{display:block}
.panel{width:100%;height:auto;padding:12px 14px 9px;background:rgba(7,12,34,.92);border:2px solid #667cff;border-radius:14px;box-shadow:0 0 0 2px rgba(30,60,255,.35),inset 0 0 22px rgba(72,50,255,.25),0 0 16px rgba(80,65,255,.65);position:relative;overflow:hidden}
.panel:before{content:"";position:absolute;inset:4px;border:1px solid rgba(99,111,255,.55);border-radius:9px;pointer-events:none}
.heading{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900;font-size:clamp(14px,2.3vw,25px);letter-spacing:.5px;text-align:center;text-shadow:0 0 8px #6377ff;white-space:nowrap}
.line{height:5px;width:9%;border-radius:5px;flex-shrink:0}
.red{background:var(--red);box-shadow:0 0 8px var(--red)}.blue{background:var(--blue);box-shadow:0 0 8px var(--blue)}
.candidates{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.candidate{min-width:0;background:rgba(5,11,30,.8);border:2px solid #6978b6;border-radius:9px;padding:8px 10px 7px;text-align:center;position:relative}
.candidate.lula{border-left:7px solid var(--red)}.candidate.flavio{border-left:7px solid var(--blue)}
.name{font-weight:900;font-size:clamp(12px,1.9vw,20px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.percent{font-weight:1000;font-size:clamp(25px,4.5vw,48px);line-height:1.1;margin-top:3px;text-shadow:0 0 9px rgba(255,255,255,.16)}
.votes{color:var(--muted);font-size:clamp(11px,1.7vw,17px);font-weight:700}
.progress-label{display:flex;justify-content:space-between;gap:8px;margin:10px 3px 5px;font-weight:800;font-size:clamp(11px,1.7vw,17px);color:var(--muted)}
.track{height:10px;background:#252e50;border:1px solid #6573b1;border-radius:9px;overflow:hidden}
.fill{height:100%;width:0%;background:linear-gradient(90deg,#ff424d,#ffb34d,#3988ff);transition:width .6s ease}
.footer{text-align:center;margin-top:8px;color:#d2d8f5;font-size:clamp(10px,1.45vw,14px);font-weight:700}
.status{color:#ffe47a;font-weight:900}
@media(max-width:600px){.panel{padding:8px}.candidates{gap:7px;margin-top:8px}.candidate{padding:6px 5px}.heading{gap:6px}.footer{margin-top:5px}}
</style>
</head>
<body>
<main class="panel" aria-label="Painel de apuração presidencial">
<div class="heading"><span class="line red"></span><span>APURAÇÃO PRESIDENCIAL · TSE</span><span class="line blue"></span></div>
<section class="candidates">
<article class="candidate lula"><div class="name" id="name13">LULA · 13</div><div class="percent" id="pct13">—%</div><div class="votes" id="votes13">— votos</div></article>
<article class="candidate flavio"><div class="name" id="name22">FLÁVIO · 22</div><div class="percent" id="pct22">—%</div><div class="votes" id="votes22">— votos</div></article>
</section>
<div class="progress-label"><span>URNAS APURADAS</span><span id="urnas">Aguardando dados…</span></div>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="footer"><span id="status" class="status">CONECTANDO À FONTE OFICIAL</span><br>Fonte: TSE · atualização automática</div>
</main>
<script>
const DATA_URL="https://resultados.tse.jus.br/oficial/ele2026/6258/dados/br/br-c0001-e006258-u.json";
const fmtInt=n=>Number(n||0).toLocaleString("pt-BR");
function setText(id,value){document.getElementById(id).textContent=value}
function parsePct(value){if(value===undefined||value===null||value==="")return 0;return Number(String(value).replace(/\./g,"").replace(",","."))||0}
async function updateResults(){
 try{
  const response=await fetch(DATA_URL+"?_="+Date.now(),{cache:"no-store"});
  if(!response.ok)throw new Error("HTTP "+response.status);
  const data=await response.json();
  const cargo=(data.carg||[]).find(c=>String(c.cd)==="1")||(data.carg||[])[0];
  const candidates=[];
  for(const group of(cargo?.agr||[]))for(const party of(group.par||[]))for(const cand of(party.cand||[]))candidates.push(cand);
  const lula=candidates.find(c=>String(c.n)==="13"||/LULA/i.test(c.nmu||c.nm||""));
  const flavio=candidates.find(c=>String(c.n)==="22"||/FLAVIO/i.test(c.nmu||c.nm||""));
  if(!lula||!flavio)throw new Error("Candidatos não encontrados");
  const lp=parsePct(lula.pvap),fp=parsePct(flavio.pvap);
  setText("name13",(lula.nmu||"LULA")+" · 13");setText("name22",(flavio.nmu||"FLÁVIO")+" · 22");
  setText("pct13",lp.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%");
  setText("pct22",fp.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%");
  setText("votes13",fmtInt(lula.vap)+" votos");setText("votes22",fmtInt(flavio.vap)+" votos");
  const sections=data.s||{},counted=Number(sections.st||0),total=Number(sections.ts||0);
  const percent=total>0?Math.max(0,Math.min(100,counted/total*100)):parsePct(sections.pst);
  setText("urnas",percent.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2})+"%");
  document.getElementById("fill").style.width=percent+"%";
  const updated=[data.dg,data.hg].filter(Boolean).join(" ");
  setText("status",(lp===0&&fp===0&&percent===0)?"AGUARDANDO INÍCIO DA TOTALIZAÇÃO":"DADOS OFICIAIS"+(updated?" · "+updated:""));
 }catch(error){setText("status","AGUARDANDO DADOS DO TSE");setText("urnas","indisponível")}
}
updateResults();setInterval(updateResults,30000);
</script>
</body></html>
